name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # The README's install file is linted as a real caller.
          mkdir -p "$RUNNER_TEMP/caller/.github/workflows"
          cp examples/drupal-qa.yml "$RUNNER_TEMP/caller/.github/workflows/"
          ./actionlint -color .github/workflows/*.yml "$RUNNER_TEMP/caller/.github/workflows/drupal-qa.yml"
      - name: composer validate
        run: composer validate --strict --no-check-lock
